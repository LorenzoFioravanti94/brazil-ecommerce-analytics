[project]
name = "orchestration"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.2",
]

[project.optional-dependencies]
# Pinned to the same version as the core `dagster` dependency above: leaving these
# unpinned lets a fresh install pull a newer dagster-dg-cli that drags dagster past
# the 1.13.2 pin and breaks dagster-dbt / webserver (which require ==1.13.2).
dev = [
    "dagster-dg-cli==1.13.2",
    "dagster-webserver==1.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "orchestration"
registry_modules = [
    "orchestration.components.*",
]


