name: dagster-cd

on:
  push:
    branches: [main]

jobs:
  trigger-dagster:
    # Skip the manifest BOT commit from post-deploy-update-manifest.yml, else it would re-trigger this workflow in a loop.
    if: "!contains(github.event.head_commit.message, 'update persistent_state manifest')"
    runs-on: ubuntu-latest
    name: Trigger Dagster Standard Job

    steps:
      - uses: actions/checkout@v6

      - name: Reload code location and run standard_job
        # Reload the code location to re-parse the merged project into a fresh manifest (else Dagster's
        # stale startup manifest -> KeyError on renamed nodes), then launch standard_job. See scripts/dagster_trigger.py.
        run: python3 scripts/dagster_trigger.py
        env:
          DAGSTER_URL: ${{ secrets.DAGSTER_URL }}
