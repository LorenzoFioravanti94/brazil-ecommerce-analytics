name: ci

on:
  pull_request:
    branches: [develop, main]

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        # dbt pins live in requirements-dbt.txt; kaggle (raw data ingestion) installed alongside.
        run: pip install -r requirements-dbt.txt kaggle

      - name: Verify dbt version (guard against silent version skew)
        run: |
          # Fail loudly if dbt-core differs from the version that produced the reference manifest.
          python -c "import dbt.version as v; assert v.__version__ == '1.11.8', f'dbt-core is {v.__version__}, expected 1.11.8'"

      - name: Install dbt packages
        run: dbt deps --project-dir warehouse

      - name: Configure Kaggle API Token
        run: |
          mkdir -p ~/.kaggle
          echo "${{ secrets.KAGGLE_API_TOKEN }}" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

      - name: Download datasets
        run: |
          kaggle datasets download \
            -d olistbr/brazilian-ecommerce \
            -p data/raw/olist \
            --unzip

          kaggle datasets download \
            -d thiagobodruk/brazilianstates \
            -p data/raw/ibge \
            --unzip

      - name: Run DuckDB ingestion
        run: python scripts/data_ingestion.py
        env:
          DBT_TARGET: test

      - name: Fetch reference manifest from main (Slim CI state)
        if: github.base_ref == 'develop'
        run: |
          # Slim CI compares the PR against what is on main: overwrite only the
          # reference manifest from origin/main, leaving the PR's code intact.
          git fetch origin main --depth=1
          git checkout origin/main -- persistent_state/manifest.json

      - name: Run dbt (Slim CI — PR towards develop)
        if: github.base_ref == 'develop'
        run: |
          cd warehouse
          dbt build \
            --selector slim_ci \
            --state ${{ github.workspace }}/persistent_state \
            --target test

      - name: Run dbt (Full CI — PR towards main)
        if: github.base_ref == 'main'
        run: |
          cd warehouse
          dbt build --target test
