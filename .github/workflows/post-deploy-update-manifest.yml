name: post-deploy-update-manifest

on:
  workflow_run:
    workflows: ["dagster-cd"]
    types:
      - completed

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    name: Update persistent dbt manifest

    # Run only if dagster-cd succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: write

    steps:
      # Check out main explicitly (not the event's commit SHA).
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.MANIFEST_PAT }}

      - name: Install dependencies
        # A dbt parse only needs the dbt pins, so requirements-dbt.txt is enough (no kaggle/ingestion).
        run: pip install -r requirements-dbt.txt

      - name: Install dbt packages
        run: dbt deps --project-dir warehouse

      - name: Generate manifest from main (dbt parse — no DB needed)
        # Uses the committed warehouse/profiles.yml (same target as ci.yml), so the
        # database name aligns; a mismatch would flag every source as state:modified.
        run: |
          cd warehouse
          dbt parse --target test

      - name: Guard against an unreadable reference manifest
        # A duckdb other than 1.0.0 writes 'javascript' into the manifest, which
        # dbt cannot read back from --state and breaks every Slim CI run. Fail here
        # instead of committing a poisoned reference. See requirements-dbt.txt.
        run: |
          if grep -q '"javascript"' warehouse/target/manifest.json; then
            echo "ERROR: generated manifest contains 'javascript' — duckdb is not pinned to 1.0.0"
            exit 1
          fi

      - name: Update persistent_state
        run: |
          mkdir -p ${{ github.workspace }}/persistent_state
          cp warehouse/target/manifest.json \
             ${{ github.workspace }}/persistent_state/manifest.json

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ${{ github.workspace }}/persistent_state/manifest.json

          if git diff --cached --quiet; then
            echo "No changes to manifest — skipping commit"
          else
            git commit -m "chore(ci): update persistent_state manifest"
            # Rebase onto any commits that landed on main since checkout,
            # otherwise a concurrent push leaves the manifest stale with no retry.
            git pull --rebase origin main
            git push origin main
          fi