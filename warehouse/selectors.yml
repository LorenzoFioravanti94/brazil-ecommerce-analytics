selectors:
  - name: slim_ci
    description: >
      Slim CI selection for PRs towards develop. It runs WITHOUT --defer because
      CI has no prod database to defer unbuilt nodes to: the fresh, empty test
      DB must therefore physically contain everything the selected nodes read.
      The selection is the union of three criteria, each covering a gap that
      would otherwise break the build:

        * state:modified, parents:true -> build the changed nodes AND their
          ancestors, so a modified model (and the models behind a modified test)
          has its upstream inputs available. Children are intentionally excluded:
          downstream tests would reference dimensions that are not ancestors of
          the changed nodes (facts FK every dim, dims are not upstream of facts)
          and so would never get built.

        * tag:always_build -> force standalone models like dim_date. They are
          never picked up by state:modified (nothing changes them), yet the
          facts' relationship tests need them present to run.

        * resource_type:seed -> force ALL seeds. Unchanged seeds are not flagged
          by state:modified, so they would not be built; but the CI DB starts
          empty, so any model that refs a seed would fail on a missing table.
          Building every seed guarantees those refs resolve.

      indirect_selection: cautious is LOAD-BEARING: a test is attached only when
      ALL the models it references are in the build set. This skips cross-
      dimension FK tests here (they are covered by Full CI on develop -> main).
      Without it dbt defaults to eager and Slim CI breaks on tests of dimensions
      that were never built.
    default: false
    definition:
      union:
        - method: state
          value: modified
          parents: true
          indirect_selection: cautious
        - method: tag
          value: always_build
          indirect_selection: cautious
        - method: resource_type
          value: seed
          indirect_selection: cautious
