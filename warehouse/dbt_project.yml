name: 'warehouse'
version: '1.0.0'

# Profile (defined in profiles.yml) that holds this project's connections.
profile: 'warehouse'

# File paths. All are dbt defaults except docs-paths, which is narrowed so dbt
# looks for doc blocks only in the dedicated docs/ directory.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

# Directories removed by `dbt clean`.
clean-targets:
  - "target"
  - "dbt_packages"

# Layer-level model defaults (Medallion + dbt doctrine). These can be overridden
# per model via the {{ config(...) }} macro.
models:
  warehouse:

    2_bronze:
      +schema: bronze
      +materialized: table
      +tags: ["bronze"]

    3_silver:
      +tags: ["silver"]

      1_staging:
        +schema: silver_staging
        +materialized: view

      2_intermediate:
        +schema: silver_intermediate
        +materialized: view

    4_gold:
      +schema: gold
      +materialized: table
      +tags: ["gold"]

    # Downstream consumption layer: use-case-specific marts built on top of the
    # Gold snowflake (e.g. ML feature sources). Kept OUT of Gold so the conformed
    # model stays use-case-agnostic; a dedicated `consumption` schema + tag make
    # the boundary explicit (and groupable in Dagster).
    5_consumption:
      +schema: consumption
      +materialized: view
      +tags: ["consumption"]

# Static reference / mapping data. Without an explicit +schema, seeds land in
# target.schema ("main" on DuckDB), which carries no meaning -> give them a
# dedicated, self-describing schema.
seeds:
  warehouse:
    +schema: seeds
