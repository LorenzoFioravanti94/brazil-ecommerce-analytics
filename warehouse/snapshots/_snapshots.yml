# Snapshot honesty note --------------------------------------------------------
# The Olist source is a STATIC Kaggle dump, so here this snapshot will only ever
# capture a single version of each order. It is defined deliberately, to simulate
# a production-ready setup: `orders` is the one Olist table with a genuine SCD2
# nature -- in a live system an order mutates through its lifecycle (status:
# created -> approved -> shipped -> delivered, with the lifecycle timestamps
# filling in over time). This snapshot is configured to capture that history the
# moment the source becomes mutable. Every other Olist/IBGE table is static
# reference data and is intentionally NOT snapshotted.
#
# Strategy `check` (not `timestamp`): orders has no single reliable row-level
# "updated_at" column, so changes are detected on the lifecycle columns below.

snapshots:
  - name: orders_snapshot
    relation: source('olist', 'orders')
    config:
      schema: snapshots
      unique_key: order_id
      strategy: check
      check_cols:
        - order_status
        - order_approved_at
        - order_delivered_carrier_date
        - order_delivered_customer_date
