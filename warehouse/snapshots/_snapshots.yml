# Defined to simulate a production-ready SCD2 setup:
#   * Olist is a static Kaggle dump — in production, orders mutates through its lifecycle
#   * orders is the only Olist table with genuine SCD2 nature; all others are static reference data
#   * strategy: check (not timestamp) — no single reliable updated_at column

snapshots:
  - name: orders_snapshot
    relation: source('olist', 'orders')
    config:
      schema: snapshots
      unique_key: order_id
      strategy: check
      check_cols:
        - order_status
        - order_approved_at
        - order_delivered_carrier_date
        - order_delivered_customer_date
